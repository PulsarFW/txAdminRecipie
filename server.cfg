# ####################
#  PULSAR FRAMEWORK
# ###################

## DO NOT EDIT ##
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
exec ./resources.cfg
##############################
## LICENSE + STEAM API KEYS ##
##############################
sv_licenseKey "{{svLicense}}"       # Auto-filled by txAdmin from the license key you enter during deploy
sv_tebexSecret ""           # Sets Tebex Integration
setr discord_app ""         # Sets Discord App ID for Rich Presense
set steam_webApiKey "changeme"  # Sets Steam Api - get yours at https://steamcommunity.com/dev/apikey
sv_maxclients 2             # need a cfx patreon license
##########################
## ENVIROMENT VARIABLES ##
##########################
set sv_enforceGameBuild 3570    # Fivem Gamebuild | 1 for enhanced
set sv_environment dev          # dev/prod/test
set sv_access_role 0            # 0 = open to everyone, or set to a Group Abbreviation (pulsar_core Config.Groups) to require it in the queue whitelist
sets sv_pureLevel 0             # Sets restrictions on graphics/client scripts
sets locale "en-US"             # Sets Server lenguage locale
set chat_showQuits 0            # Removes player quits messages from chat
set chat_showJoins 0            # Removes player join messages from chat
sv_endpointPrivacy true         ## LEAVE TRUE OR PEOPLE CAN GET IPS OF PLAYERS VIA PLAYER.JSON!! ##
set danger_everyone_is_admin 1  #! Give Admin to everyone who joins !#
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
setr sv_showBusySpinnerOnLoadingScreen false #Hides the default busy spinner in the bottom right corner of the screen 
#####################
## CONSOLE Logging ##
#####################
# level 1 'trace'
# level 2 'info'
# level 3 'warn'
# level 4 'error'
# level 5 'critical'
setr log_level 2
##############################
## Pulsar Framework Version ##
##############################
setr plsr_version 1.0.0
########################
## MAIN CONFIGURATION ##
########################
sets motd "Welcome to Pulsar Framework!"   ##? Sets MOTD above Character Selector ## 
set sv_hostname "{{serverName}}"
set sv_projectName "[{{recipeName}}] {{serverName}}"
set sv_projectDesc "{{recipeDescription}}"
sets tags "housing, gangs, robberies, drugs, custom cars, custom clothing, pd, ems, racing"
sets banner_detail ""
sets banner_connecting ""
load_server_icon logo.png

sets discord "https://discord.gg/ZexaMRuWk2"
sets website "https://www.pulsarframe.work/"
sets SERVER_TYPE "development"
set winter_only "false" 
#########################
## DATABASE CONNECTION ##
#########################
set mysql_connection_string "{{dbConnectionString}}"  # filled in by the recipe's replace_string task from your txAdmin DB step-2 input
set mysql_slow_query_warning 1000
#set mysql_debug true
set mysql_ui true
sv_scriptHookAllowed 0
############################# 
## DISCORD WEBHOOK LOGGING ##
#############################
set discord_admin_webhook "#"
set discord_connection_webhook "#"
set discord_log_webhook "#"
set discord_kill_webhook "#"
set discord_pwnzor_webhook "#"
set discord_error_webhook "#"
set discord_donation_webhook "#"
set discord_loot_webhook "#"

# Sets phone selfie mode webhook
set phone_selfie_webhook ""
set phone_selfie_token ""
set evidence_selfie_webhook ""
#######################
## Admin Permissions ##
#######################
add_ace group.admin command allow # allow all commands
add_principal resource.pulsar_core group.admin
# Casino Open/Close
set casino_open true

# allowing to send peds through windows in vehicles
setr game_enableFlyThroughWindscreen true
# allowing to activate ragdoll on jump like in SP (Jump+R).
setr game_enablePlayerJumpRagdollControl true
# allowing to activate native ragdoll on collision game logic
setr game_enablePlayerRagdollOnCollision true
# disabled reticule
setr profile_skfx 0
setr profile_gfxCityDensity 0
setr profile_gfxPopVariety 0
setr profile_fpsFieldOfView 10

########################
## API Endpoint/Token ##
## DO NOT USE FOR NOW ##
########################
set api_address "https://example.com/api/"
set api_id "<id>"
set api_secret "<secret>"

set WS_MDT_ALERTS "http://localhost:4002/mdt-alerts" #
set WS_MDT_ALERTS_WSS "http://localhost:4002/mdt-alerts" #Make sure when making this URL you set it to wss not https!!


# Comment to LIST the server
# Uncomment to NOT LIST the server
# sv_master1 ""
