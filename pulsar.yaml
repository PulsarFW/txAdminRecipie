$engine: 3
$onesync: on
name: Pulsar Framework
version: 1.0.0
author: PulsarFW
description: An advanced FiveM RP framework including jobs, gangs, housing & more!

tasks:
  # Download Base Files
  - action: download_github
    src: https://github.com/Artmines/TxAdminRecipie
    ref: main
    dest: ./tmp/pulsar

  - action: move_path
    src: ./tmp/pulsar/server.cfg
    dest: ./server.cfg

  - action: move_path
    src: ./tmp/pulsar/resources.cfg
    dest: ./resources.cfg

  - action: move_path
    src: ./tmp/pulsar/logo96.png
    dest: ./logo.png

  # Prepare Database
  - action: connect_database
  - action: query_database
    file: ./tmp/pulsar/pulsar.sql

  # Fill in {{dbConnectionString}} etc in server.cfg ({{svLicense}} is auto-replaced by txAdmin separately)
  - action: replace_string
    mode: all_vars
    file: ./server.cfg

  # STANDALONE / cfx defaults (mapmanager, spawnmanager, yarn, fivem-map-hipster, etc)
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    subpath: resources
    dest: ./resources/[cfx-default]

  # Third-party dependencies (not ours) - pulled from their own releases since we don't own/build them
  - action: download_file
    path: ./tmp/oxmysql.zip
    url: https://github.com/overextended/oxmysql/releases/latest/download/oxmysql.zip
  - action: unzip
    dest: ./resources/[standalone]
    src: ./tmp/oxmysql.zip

  - action: download_file
    path: ./tmp/screencapture.zip
    url: https://github.com/itschip/screencapture/releases/latest/download/screencapture.zip
  - action: unzip
    dest: ./resources/[standalone]
    src: ./tmp/screencapture.zip

  - action: download_file
    path: ./tmp/discord-screenshot.zip
    url: https://github.com/jaimeadf/discord-screenshot/releases/download/1.3.7/discord-screenshot-1.3.7.zip
  - action: unzip
    dest: ./resources/[standalone]
    src: ./tmp/discord-screenshot.zip

  - action: waste_time # prevent github throttling
    seconds: 8

  # Pulsar Framework resources (pulled from each resource's own latest GitHub release)
  - action: download_file
    path: ./tmp/pulsar_loadscreen.zip
